openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: budget
    description: Construction budget data and source references
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /budget/chapter-seed-status:
    get:
      operationId: getChapterSeedStatus
      tags: [budget]
      summary: Get chapter startup seed status
      responses:
        "200":
          description: Whether the chapter startup seed completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChapterSeedStatus"
  /budget/dashboard:
    get:
      operationId: getBudgetDashboard
      tags: [budget]
      summary: Get budget dashboard summary
      responses:
        "200":
          description: Budget dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetDashboard"
  /budget/planner-inputs:
    get:
      operationId: getPlannerInputs
      tags: [budget]
      summary: List saved planner assumptions by house type
      responses:
        "200":
          description: Saved Planner assumptions by house type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerInputs"
  /budget/house-types:
    get:
      operationId: getPlannerHouseTypes
      tags: [budget]
      summary: List house types available in Planner
      responses:
        "200":
          description: Ordered house types and their cost bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HouseType"
  /budget/planner-inputs/{houseTypeId}:
    put:
      operationId: updatePlannerInputs
      tags: [budget]
      summary: Save planner assumptions for a house type
      parameters:
        - name: houseTypeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerInputsUpdate"
      responses:
        "200":
          description: Saved planner assumptions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlannerInputs"
  /budget/planner-sale-prices:
    put:
      operationId: updatePlannerSalePrices
      tags: [budget]
      summary: Save sale prices and notes for house types
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlannerSalePricesUpdate"
      responses:
        "200":
          description: Saved sale prices and notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlannerSalePriceRow"
        "400":
          description: Invalid or duplicate house type
        "404":
          description: House type not found
  /budget/projects:
    get:
      operationId: getBudgetProjects
      tags: [budget]
      summary: List building types
      responses:
        "200":
          description: Building types represented in architecture sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetProject"
  /budget/sources:
    get:
      operationId: getBudgetSources
      tags: [budget]
      summary: List linked source folders and files
      responses:
        "200":
          description: Read-only links to source material
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetSource"
  /budget/sources/{sourceId}/check:
    post:
      operationId: checkBudgetSourceConnection
      tags: [budget]
      summary: Check a linked Google Drive source
      parameters:
        - name: sourceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drive metadata and direct-child check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSourceCheck"
        "404":
          description: Source not found
  /budget/lines:
    get:
      operationId: getBudgetLines
      tags: [budget]
      summary: List budget lines
      responses:
        "200":
          description: Budget lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"
    post:
      operationId: createBudgetLine
      tags: [budget]
      summary: Create a budget line
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetLineInput"
      responses:
        "201":
          description: Created budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
  /budget/cap-chapters:
    get:
      operationId: getCapChapters
      tags: [budget]
      summary: List effective CAP chapter definitions
      responses:
        "200":
          description: CAP chapters in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapChapter"
  /budget/line-chapter-overrides:
    get:
      operationId: getLineChapterOverrides
      tags: [budget]
      summary: List budget line chapter overrides
      responses:
        "200":
          description: Chapter overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LineChapterOverride"
  /budget/line-chapter-overrides/{budgetLineCode}:
    parameters:
      - name: budgetLineCode
        in: path
        required: true
        schema:
          type: string
    put:
      operationId: upsertLineChapterOverride
      tags: [budget]
      summary: Add or change a budget line chapter override
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineChapterOverrideInput"
      responses:
        "200":
          description: Saved chapter override
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineChapterOverride"
        "400":
          description: Invalid override
        "404":
          description: Budget line or chapter not found
    delete:
      operationId: deleteLineChapterOverride
      tags: [budget]
      summary: Remove a chapter override and restore the source chapter
      responses:
        "204":
          description: Chapter override removed
  /budget/line-markers/{budgetLineCode}:
    patch:
      operationId: updateBudgetLineMarker
      tags: [budget]
      summary: Update a budget line marker
      parameters:
        - name: budgetLineCode
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineMarkerUpdate"
      responses:
        "200":
          description: Updated line marker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineMarker"
        "404":
          description: Budget line not found
  /budget/lines/import:
    post:
      operationId: importBudgetLines
      tags: [budget]
      summary: Import budget lines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetLineImport"
      responses:
        "201":
          description: Imported budget lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetLine"
  /budget/lines/{lineId}:
    patch:
      operationId: updateBudgetLine
      tags: [budget]
      summary: Update a budget line
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetLineUpdate"
      responses:
        "200":
          description: Updated budget line
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetLine"
        "404":
          description: Budget line not found
    delete:
      operationId: deleteBudgetLine
      tags: [budget]
      summary: Delete a budget line
      parameters:
        - name: lineId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Budget line deleted
        "404":
          description: Budget line not found
  /budget/extras:
    get:
      operationId: getBudgetExtras
      tags: [budget]
      summary: List pack extras
      responses:
        "200":
          description: Pack extras
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetExtra"
  /budget/extras/{extraId}:
    patch:
      operationId: updateBudgetExtra
      tags: [budget]
      summary: Update a pack extra
      parameters:
        - name: extraId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetExtraUpdate"
      responses:
        "200":
          description: Updated pack extra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetExtra"
        "404":
          description: Pack extra not found
  /budget/quotes:
    get:
      operationId: getBudgetQuotes
      tags: [budget]
      summary: List supplier quotes and source documents
      responses:
        "200":
          description: Quotes and categorized source documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetQuote"
    post:
      operationId: createBudgetQuote
      tags: [budget]
      summary: Add a supplier quote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetQuoteInput"
      responses:
        "201":
          description: Created quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetQuote"
  /budget/quotes/{quoteId}:
    patch:
      operationId: updateBudgetQuote
      tags: [budget]
      summary: Update a supplier quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetQuoteUpdate"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetQuote"
        "404":
          description: Quote not found
  /budget/quote-links:
    get:
      operationId: getBudgetQuoteLinks
      tags: [budget]
      summary: List quote links to budget lines and extras
      responses:
        "200":
          description: Quote links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetQuoteLink"
  /budget/quotes/{quoteId}/links:
    put:
      operationId: updateBudgetQuoteLinks
      tags: [budget]
      summary: Replace a quote's linked budget lines and extras
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BudgetQuoteLinksUpdate"
      responses:
        "200":
          description: Updated quote links
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetQuoteLink"
        "404":
          description: Quote not found
        "400":
          description: Invalid quote link target
    delete:
      operationId: deleteBudgetQuote
      tags: [budget]
      summary: Delete a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Quote deleted
        "404":
          description: Quote not found
components:
  schemas:
    ChapterSeedStatus:
      type: object
      required: [seeded]
      properties:
        seeded: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BudgetProject:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sourceUrl: { type: string }
      required: [id, name, sourceUrl]
    BudgetSource:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sourceType: { type: string, enum: [spreadsheet, folder, plan] }
        url: { type: string }
        note: { type: string }
        snapshotVerifiedOn: { type: ["string", "null"] }
        snapshotDriveModifiedTime: { type: ["string", "null"] }
        snapshotDriftStatus: { type: ["string", "null"], enum: [never checked, in sync, changed in Drive] }
        driveModifiedTime: { type: ["string", "null"] }
        lastCheckedAt: { type: ["string", "null"] }
        status: { type: ["string", "null"] }
        itemCount: { type: ["integer", "null"] }
        children:
          type: array
          items: { $ref: "#/components/schemas/BudgetSourceChild" }
      required: [id, name, sourceType, url, note, snapshotVerifiedOn, snapshotDriveModifiedTime, snapshotDriftStatus, driveModifiedTime, lastCheckedAt, status, itemCount, children]
    BudgetSourceChild:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        modifiedTime: { type: ["string", "null"] }
      required: [name, type, modifiedTime]
    BudgetSourceCheck:
      type: object
      properties:
        id: { type: string }
        driveModifiedTime: { type: ["string", "null"] }
        lastCheckedAt: { type: string }
        status: { type: string }
        itemCount: { type: ["integer", "null"] }
        children:
          type: array
          items: { $ref: "#/components/schemas/BudgetSourceChild" }
        error: { type: ["string", "null"] }
      required: [id, driveModifiedTime, lastCheckedAt, status, itemCount, children, error]
    BudgetMetric:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        value: { type: number }
        sourceColumn: { type: string }
        fromCsvLines: { type: number }
        fromCommonLines: { type: ["number", "null"] }
        fromPremiumRatedLines: { type: ["number", "null"] }
        notApplicableLineCount: { type: ["integer", "null"] }
        notApplicableStandardValue: { type: ["number", "null"] }
        fromExtras: { type: number }
        pendingExtraCount: { type: integer }
      required: [id, label, value, sourceColumn, fromCsvLines, fromCommonLines, fromPremiumRatedLines, notApplicableLineCount, notApplicableStandardValue, fromExtras, pendingExtraCount]
    BudgetDashboard:
      type: object
      properties:
        sourceMetrics:
          type: array
          items: { $ref: "#/components/schemas/BudgetMetric" }
        lineCount: { type: integer }
        quoteCount: { type: integer }
        linesNeedingReview: { type: integer }
        quotesNeedingReview: { type: integer }
      required: [sourceMetrics, lineCount, quoteCount, linesNeedingReview, quotesNeedingReview]
    PlannerInputs:
      type: object
      properties:
        houseTypeId: { type: string }
        landNote: { type: ["string", "null"] }
        grossArea: { type: ["number", "null"] }
        land: { type: ["number", "null"] }
        designLicensing: { type: ["number", "null"] }
        managementPercent: { type: ["number", "null"] }
        contingencyPercent: { type: ["number", "null"] }
        targetNetMarginPercent: { type: ["number", "null"] }
        salesCommissionPercent: { type: ["number", "null"] }
        taxesPercent: { type: ["number", "null"] }
        standardReferenceSellingPrice: { type: ["number", "null"] }
        ecoReferenceSellingPrice: { type: ["number", "null"] }
        premiumReferenceSellingPrice: { type: ["number", "null"] }
        priceNoteStandard: { type: ["string", "null"] }
        priceNoteEco: { type: ["string", "null"] }
        priceNotePremium: { type: ["string", "null"] }
      required: [houseTypeId, landNote, grossArea, land, designLicensing, managementPercent, contingencyPercent, targetNetMarginPercent, salesCommissionPercent, taxesPercent, standardReferenceSellingPrice, ecoReferenceSellingPrice, premiumReferenceSellingPrice, priceNoteStandard, priceNoteEco, priceNotePremium]
    PlannerInputsUpdate:
      type: object
      properties:
        landNote: { type: ["string", "null"] }
        grossArea: { type: ["number", "null"] }
        land: { type: ["number", "null"] }
        designLicensing: { type: ["number", "null"] }
        managementPercent: { type: ["number", "null"] }
        contingencyPercent: { type: ["number", "null"] }
        targetNetMarginPercent: { type: ["number", "null"] }
        salesCommissionPercent: { type: ["number", "null"] }
        taxesPercent: { type: ["number", "null"] }
      required: [landNote, grossArea, land, designLicensing, managementPercent, contingencyPercent, targetNetMarginPercent, salesCommissionPercent, taxesPercent]
    PlannerSalePriceRow:
      type: object
      properties:
        houseTypeId: { type: string }
        standardReferenceSellingPrice: { type: ["number", "null"] }
        ecoReferenceSellingPrice: { type: ["number", "null"] }
        premiumReferenceSellingPrice: { type: ["number", "null"] }
        priceNoteStandard: { type: ["string", "null"] }
        priceNoteEco: { type: ["string", "null"] }
        priceNotePremium: { type: ["string", "null"] }
      required: [houseTypeId, standardReferenceSellingPrice, ecoReferenceSellingPrice, premiumReferenceSellingPrice, priceNoteStandard, priceNoteEco, priceNotePremium]
    PlannerSalePricesUpdate:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PlannerSalePriceRow"
      required: [rows]
    HouseType:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        costBasis: { type: string }
      required: [id, name, sortOrder, costBasis]
    CapChapter:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        sortOrder: { type: integer }
        kind: { type: string, enum: [original, added] }
        specReference: { type: ["string", "null"] }
        decidedOn: { type: ["string", "null"] }
        decisionReason: { type: ["string", "null"] }
      required: [code, name, sortOrder, kind, specReference, decidedOn, decisionReason]
    LineChapterOverride:
      type: object
      properties:
        budgetLineCode: { type: string }
        chapterCode: { type: string }
        reason: { type: string }
        decidedOn: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [budgetLineCode, chapterCode, reason, decidedOn, createdAt]
    LineChapterOverrideInput:
      type: object
      properties:
        chapterCode: { type: string, minLength: 1 }
        reason: { type: string, minLength: 1 }
        decidedOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      required: [chapterCode, reason, decidedOn]
    BudgetLine:
      type: object
      properties:
        id: { type: string }
        code: { type: ["string", "null"] }
        category: { type: string }
        item: { type: string }
        unit: { type: ["string", "null"] }
        quantity: { type: ["number", "null"] }
        standardUnitPrice: { type: ["number", "null"] }
        standardTotal: { type: ["number", "null"] }
        ecoUnitPrice: { type: ["number", "null"] }
        ecoTotal: { type: ["number", "null"] }
        premiumUnitPrice: { type: ["number", "null"] }
        premiumTotal: { type: ["number", "null"] }
        buildingType: { type: ["string", "null"] }
        vendor: { type: ["string", "null"] }
        receitas: { type: ["number", "null"] }
        balanco: { type: ["number", "null"] }
        investimento: { type: ["number", "null"] }
        despesas: { type: ["number", "null"] }
        quoteAmount: { type: ["number", "null"] }
        status: { type: string, enum: [planned, quoted, committed, paid, needs_review] }
        reviewStatus: { type: string, enum: [unreviewed, confirmed] }
        sourceRow: { type: ["integer", "null"] }
        sourceNote: { type: ["string", "null"] }
        sourceId: { type: ["string", "null"] }
        origin: { type: string, enum: [imported, manual, assumption] }
        priceBasis: { type: ["string", "null"] }
        marker: { type: string, enum: [common, finishings, equipment, systems, not_applicable] }
        markerDecisionReason: { type: ["string", "null"] }
        markerDecidedOn: { type: ["string", "null"] }
        sourceUrl: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
      required: [id, code, category, item, unit, quantity, standardUnitPrice, standardTotal, ecoUnitPrice, ecoTotal, premiumUnitPrice, premiumTotal, buildingType, vendor, receitas, balanco, investimento, despesas, quoteAmount, status, reviewStatus, sourceRow, sourceNote, sourceId, origin, priceBasis, marker, markerDecisionReason, markerDecidedOn, sourceUrl, createdAt, updatedAt]
    BudgetLineInput:
      type: object
      properties:
        code: { type: ["string", "null"] }
        category: { type: string, minLength: 1 }
        item: { type: string, minLength: 1 }
        unit: { type: ["string", "null"] }
        quantity: { type: ["number", "null"] }
        standardUnitPrice: { type: ["number", "null"] }
        standardTotal: { type: ["number", "null"] }
        ecoUnitPrice: { type: ["number", "null"] }
        ecoTotal: { type: ["number", "null"] }
        premiumUnitPrice: { type: ["number", "null"] }
        premiumTotal: { type: ["number", "null"] }
        buildingType: { type: ["string", "null"] }
        vendor: { type: ["string", "null"] }
        receitas: { type: ["number", "null"] }
        balanco: { type: ["number", "null"] }
        investimento: { type: ["number", "null"] }
        despesas: { type: ["number", "null"] }
        quoteAmount: { type: ["number", "null"] }
        status: { type: string, enum: [planned, quoted, committed, paid, needs_review] }
        reviewStatus: { type: string, enum: [unreviewed, confirmed] }
        sourceRow: { type: ["integer", "null"] }
        sourceNote: { type: ["string", "null"] }
      required: [category, item, status, reviewStatus]
    BudgetLineUpdate:
      type: object
      properties:
        code: { type: ["string", "null"] }
        category: { type: string, minLength: 1 }
        item: { type: string, minLength: 1 }
        unit: { type: ["string", "null"] }
        quantity: { type: ["number", "null"] }
        standardUnitPrice: { type: ["number", "null"] }
        standardTotal: { type: ["number", "null"] }
        ecoUnitPrice: { type: ["number", "null"] }
        ecoTotal: { type: ["number", "null"] }
        premiumUnitPrice: { type: ["number", "null"] }
        premiumTotal: { type: ["number", "null"] }
        buildingType: { type: ["string", "null"] }
        vendor: { type: ["string", "null"] }
        receitas: { type: ["number", "null"] }
        balanco: { type: ["number", "null"] }
        investimento: { type: ["number", "null"] }
        despesas: { type: ["number", "null"] }
        quoteAmount: { type: ["number", "null"] }
        status: { type: string, enum: [planned, quoted, committed, paid, needs_review] }
        reviewStatus: { type: string, enum: [unreviewed, confirmed] }
        sourceRow: { type: ["integer", "null"] }
        sourceNote: { type: ["string", "null"] }
    BudgetLineImport:
      type: array
      items:
        $ref: "#/components/schemas/BudgetLineInput"
    LineMarker:
      type: object
      properties:
        budgetLineCode: { type: string }
        marker: { type: string, enum: [common, finishings, equipment, systems, not_applicable] }
        decisionReason: { type: ["string", "null"] }
        decidedOn: { type: ["string", "null"] }
      required: [budgetLineCode, marker, decisionReason, decidedOn]
    LineMarkerUpdate:
      type: object
      properties:
        marker: { type: string, enum: [common, finishings, equipment, systems, not_applicable] }
        decisionReason: { type: string, minLength: 1 }
        decidedOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      required: [marker, decisionReason, decidedOn]
    BudgetExtra:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        inEco: { type: boolean }
        inPremium: { type: boolean }
        quantity: { type: integer }
        unit: { type: string }
        priceScope: { type: string }
        unitPrice: { type: ["number", "null"] }
        priceStatus: { type: string, enum: [estimate, quoted, pending] }
        quoteId: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        decisionReason: { type: ["string", "null"] }
        decidedOn: { type: ["string", "null"] }
